plugins {
    id 'com.android.application'
}

android {
    namespace 'com.baromemo.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.baromemo.app"
        minSdk 29
        targetSdk 35
        versionCode 25
        versionName "0.25"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
